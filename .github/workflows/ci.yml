name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Pytest
        run: cd backend && python -m pytest tests -q
        env:
          JWT_SECRET_KEY: test-secret-key-min-32-chars-1234567890
          APP_ENV: test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: con checkout shallow, gitleaks atribuye
          # todo el árbol al HEAD y los ignores por fingerprint no casan.
          fetch-depth: 0
      - name: Validate compose
        run: docker compose config
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
